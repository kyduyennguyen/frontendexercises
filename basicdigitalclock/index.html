<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/favicon.png" type="image/png" sizes="32x32" />
    <title>Basic Clocks</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <!-- Basic Digital Clock -->
    <h2 class="title">Basic Digital Clock</h2>
    <div class="clock-container">
      <div id="time" class="time">00:00:00</div>
      <div id="date" class="date">Thursday, November 12, 2026</div>
    </div>
    <!-- Basic Countdown Timer -->
    <h2 class="title">Basic Countdown Timer</h2>
    <div class="timer">
      <h3>2026 Year-End Finale — Limited Time Only</h3>
      <div class="countdown">
        <div><span id="days">00</span><small>Days</small></div>
        <div><span id="hours">00</span><small>Hours</small></div>
        <div><span id="minutes">00</span><small>Minutes</small></div>
        <div><span id="seconds">00</span><small>Seconds</small></div>
      </div>
    </div>
  </body>
</html>
